<title>ЕАВИИАС МСЭ — Заявления на МСЭ</title>
<meta name="description" content="Интерактивный прототип модуля автоматической маршрутизации заявок на медико-социальную экспертизу">
<style>
  :root{
    --accent:#1B4F72;
    --bg:#F4F6F8;
    --panel:#FFFFFF;
    --border:#D6DCE3;
    --text:#1F2933;
    --text-secondary:#5B6B7B;
    --track-simplified:#1E7A5F;
    --track-full:#6B7785;
    --amber:#B35309;
    --warning:#A32E2E;
    --track-simplified-bg:#E4F1EC;
    --track-full-bg:#E9ECEF;
    --amber-bg:#FBEBD9;
    --warning-bg:#F7E5E5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:14px;
    line-height:1.45;
    min-width:1280px;
  }
  button,select,input{font-family:inherit;font-size:inherit;color:inherit;}
  button{cursor:pointer;}
  button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible,a:focus-visible{
    outline:2px solid var(--accent);outline-offset:1px;
  }
  table{border-collapse:collapse;width:100%;}

  /* ===== Шапка ===== */
  .app-header{
    background:var(--accent);
    color:#fff;
    display:flex;
    align-items:center;
    gap:24px;
    padding:0 24px;
    height:56px;
    position:sticky;top:0;z-index:50;
  }
  .app-header .system-name{font-weight:700;font-size:15px;white-space:nowrap;}
  .app-header .module-name{font-size:13px;opacity:.85;white-space:nowrap;border-left:1px solid rgba(255,255,255,.35);padding-left:16px;}
  .app-header .spacer{flex:1;}
  .role-switch{display:flex;background:rgba(255,255,255,.12);border-radius:3px;padding:2px;gap:2px;}
  .role-switch button{
    background:transparent;border:none;color:#fff;padding:7px 14px;border-radius:2px;font-size:13px;opacity:.75;
    transition:background .2s,opacity .2s;
  }
  .role-switch button.active{background:#fff;color:var(--accent);opacity:1;font-weight:600;}
  .role-switch button:not(.active):hover{opacity:1;background:rgba(255,255,255,.1);}
  .user-stub{font-size:13px;opacity:.9;white-space:nowrap;}
  .header-date{font-size:13px;opacity:.9;white-space:nowrap;border-left:1px solid rgba(255,255,255,.35);padding-left:16px;}

  #app-body{padding:20px 24px 48px;max-width:1440px;margin:0 auto;}

  .screen-fade{animation:screenFade .28s ease;}
  @keyframes screenFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  h1.screen-title{font-size:20px;margin:0 0 16px;font-weight:600;}
  h2.block-title{font-size:16px;margin:0 0 12px;font-weight:600;}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:16px;margin-bottom:16px;}

  /* ===== Фильтры ===== */
  .filters-bar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;}
  .filter-field{display:flex;flex-direction:column;gap:4px;}
  .filter-field label{font-size:12px;color:var(--text-secondary);}
  .filter-field select,.filter-field input{
    border:1px solid var(--border);border-radius:3px;padding:7px 10px;background:#fff;min-width:170px;
  }
  .filter-field input[type=search]{min-width:220px;}

  .status-filter{position:relative;}
  .status-filter summary{
    border:1px solid var(--border);border-radius:3px;padding:7px 10px;background:#fff;min-width:170px;
    cursor:pointer;list-style:none;font-size:14px;color:var(--text);user-select:none;
  }
  .status-filter summary::-webkit-details-marker{display:none;}
  .status-filter summary::after{content:'▾';float:right;color:var(--text-secondary);margin-left:8px;}
  .status-filter[open] summary::after{content:'▴';}
  .status-filter-options{
    position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--border);border-radius:3px;
    padding:8px 4px;box-shadow:0 3px 10px rgba(0,0,0,.12);z-index:20;min-width:220px;
  }
  .status-filter-option{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:13px;cursor:pointer;white-space:nowrap;}
  .status-filter-option:hover{background:#F4F8FA;}
  /* Сброс: чекбокс — прямой потомок .filter-field, поэтому иначе унаследует
     min-width:170px/паддинги/рамку из общего правила для текстовых полей и select. */
  .status-filter-option input[type=checkbox]{margin:0;min-width:0;width:14px;height:14px;padding:0;border:none;background:none;flex-shrink:0;}

  .summary-line{font-size:13px;color:var(--text-secondary);margin:14px 0 10px;display:flex;gap:6px;flex-wrap:wrap;}
  .summary-line b{color:var(--text);font-weight:600;}
  .summary-line .sep{color:var(--border);}

  /* ===== Таблица ===== */
  .table-wrap{border:1px solid var(--border);border-radius:3px;background:#fff;max-height:640px;overflow:auto;}
  table.queue-table th,table.queue-table td{
    text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  table.queue-table thead th{
    position:sticky;top:0;background:#F0F3F5;color:var(--text-secondary);font-weight:600;font-size:12.5px;
    text-transform:uppercase;letter-spacing:.02em;z-index:1;border-bottom:1px solid var(--border);
  }
  table.queue-table th.sortable{cursor:pointer;user-select:none;}
  table.queue-table th.sortable:hover{color:var(--text);}
  table.queue-table th.sortable:hover .sort-icon{opacity:.85;}
  table.queue-table th .sort-icon{margin-left:5px;opacity:.4;font-size:11px;font-weight:400;letter-spacing:0;display:inline-block;}
  table.queue-table th .sort-icon.active{opacity:1;color:var(--accent);font-weight:700;}
  table.queue-table tbody tr{cursor:pointer;transition:background .12s;}
  table.queue-table tbody tr:hover{background:#F4F8FA;}
  table.queue-table tbody tr:last-child td{border-bottom:none;}

  .link-button{
    background:none;border:none;padding:0;margin:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;
  }
  /* В очереди заявок номер не подчёркнут — кликабельность там очевидна по всей строке;
     подчёркивание оставлено только там, где ссылка — единственный кликабельный элемент (лента событий). */
  .link-button.link-button-plain{text-decoration:none;}
  .link-button.link-button-plain:hover{text-decoration:underline;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:3px;font-size:12.5px;font-weight:600;white-space:nowrap;}
  .badge.badge-simplified{background:var(--track-simplified-bg);color:var(--track-simplified);}
  .badge.badge-full{background:var(--track-full-bg);color:var(--track-full);}
  .badge.badge-deadline-reduced{background:var(--amber-bg);color:var(--amber);}
  .deadline-badge-icon{margin-right:1px;}
  .badge.badge-lg{font-size:15px;padding:6px 14px;}
  .no-assess-flag{
    display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;
    background:var(--text-secondary);color:#fff;font-size:11px;font-weight:700;cursor:help;margin-left:6px;
  }

  .pagination{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:13px;flex-wrap:wrap;}
  .pagination button{
    border:1px solid var(--border);background:#fff;border-radius:3px;padding:5px 10px;min-width:32px;
  }
  .pagination button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .pagination button:disabled{opacity:.4;cursor:default;}
  .pagination .page-info{color:var(--text-secondary);margin-left:8px;}

  /* ===== Карточка заявления ===== */
  .card-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .btn{
    border:1px solid var(--border);background:#fff;border-radius:3px;padding:8px 16px;font-size:13px;font-weight:600;
    transition:background .15s,border-color .15s;
  }
  .btn:hover{background:#F0F3F5;}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn-primary:hover{background:#164062;}
  .btn-primary:disabled{background:var(--track-full);border-color:var(--track-full);opacity:.55;cursor:default;}
  .btn-danger{background:var(--warning);color:#fff;border-color:var(--warning);}

  .card-header-block{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .card-header-block .meta{display:flex;flex-direction:column;gap:4px;}
  .card-header-block .app-number{font-size:20px;font-weight:700;margin:0;}
  .card-header-block .app-date{color:var(--text-secondary);font-size:13px;}
  .card-track-explain{margin-top:10px;color:var(--text-secondary);font-size:13px;}
  .card-track-explain.deadline-reduced-note{color:var(--amber);}
  .track-badge-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
  .track-badge-label{font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;}

  /* grid-auto-flow:column + заданное число строк = сначала заполняется весь
     левый столбец сверху вниз, потом правый — а не построчно слева направо. */
  .field-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5, auto);grid-auto-flow:column;gap:0 32px;margin:0;}
  .field-row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--border);}
  .field-row .field-name,.field-row .field-value{margin:0;}
  .field-row .field-name{color:var(--text-secondary);}
  .field-row .field-value{font-weight:600;text-align:right;}

  table.docs-table th,table.docs-table td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;}
  table.docs-table thead th{background:#F0F3F5;color:var(--text-secondary);font-weight:600;font-size:12.5px;}
  table.docs-table tbody tr{cursor:pointer;transition:background .12s;}
  table.docs-table tbody tr:hover{background:#F4F8FA;}
  .doc-status{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;}
  .doc-status .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .doc-status.status-ok .dot{background:var(--track-simplified);}
  .doc-status.status-partial .dot{background:var(--amber);}
  .doc-status.status-fail .dot{background:var(--warning);}
  .docs-summary{color:var(--text-secondary);font-size:13px;margin-bottom:10px;}
  table.docs-table tbody tr.key-doc-issue{background:var(--warning-bg);}
  table.docs-table tbody tr.key-doc-issue:hover{background:#F1D9D9;}
  .key-doc-tag{display:inline-block;font-size:11px;font-weight:700;color:var(--warning);border:1px solid var(--warning);border-radius:2px;padding:1px 5px;margin-left:8px;vertical-align:middle;}

  table.factors-table th,table.factors-table td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top;}
  table.factors-table thead th{background:#F0F3F5;color:var(--text-secondary);font-weight:600;font-size:12.5px;}
  table.factors-table tbody tr:last-child td{border-bottom:none;}
  table.factors-table td.factor-name{font-weight:600;white-space:nowrap;width:230px;}
  .factor-detail{display:flex;align-items:flex-start;gap:9px;}
  .factor-icon{flex-shrink:0;width:18px;height:18px;margin-top:1px;}
  .factors-legend{display:flex;gap:24px;margin-top:14px;flex-wrap:wrap;}
  .factors-legend .legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-secondary);}
  .factors-legend .factor-icon{width:16px;height:16px;}
  .no-assess-message{
    background:#F0F3F5;border:1px solid var(--border);border-radius:3px;padding:14px;font-size:13px;color:var(--text);
  }

  .stub-panel{
    position:fixed;top:0;right:0;height:100%;width:360px;background:#fff;border-left:1px solid var(--border);
    box-shadow:-2px 0 8px rgba(0,0,0,.08);z-index:80;transform:translateX(100%);transition:transform .25s ease;
    padding:20px;display:flex;flex-direction:column;
  }
  .stub-panel.open{transform:translateX(0);}
  .stub-panel h3{margin:0 0 12px;font-size:15px;}
  .stub-panel p{color:var(--text-secondary);font-size:13px;}
  .stub-overlay{
    position:fixed;inset:0;background:rgba(31,41,51,.25);z-index:79;opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .stub-overlay.open{opacity:1;pointer-events:auto;}

  /* ===== Модальное окно перевода ===== */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(31,41,51,.35);z-index:90;display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .modal-box{background:#fff;border-radius:3px;padding:24px;width:420px;box-shadow:0 4px 24px rgba(0,0,0,.18);}
  .modal-box h3{margin:0 0 14px;font-size:16px;}
  .modal-box p{margin:0 0 18px;font-size:13px;color:var(--text-secondary);}
  .modal-box label{display:block;font-size:12.5px;color:var(--text-secondary);margin-bottom:6px;}
  .modal-box select,.modal-box input[type=text]{width:100%;border:1px solid var(--border);border-radius:3px;padding:9px 10px;margin-bottom:18px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;}

  /* ===== Мониторинг ===== */
  .monitor-controls{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .period-switch{display:flex;background:#fff;border:1px solid var(--border);border-radius:3px;overflow:hidden;}
  .period-switch button{border:none;background:#fff;padding:8px 16px;font-size:13px;border-right:1px solid var(--border);}
  .period-switch button:last-child{border-right:none;}
  .period-switch button.active{background:var(--accent);color:#fff;font-weight:600;}
  .threshold-line{color:var(--text-secondary);font-size:12.5px;}

  .head-tabs{display:flex;background:#fff;border:1px solid var(--border);border-radius:3px;overflow:hidden;margin-bottom:16px;width:fit-content;}
  .head-tabs button{border:none;background:#fff;padding:9px 20px;font-size:13px;font-weight:600;border-right:1px solid var(--border);color:var(--text-secondary);}
  .head-tabs button:last-child{border-right:none;}
  .head-tabs button.active{background:var(--accent);color:#fff;}

  .tiles-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px;}
  .tile{background:#fff;border:1px solid var(--border);border-radius:3px;padding:16px;}
  .tile .tile-label{font-size:12.5px;color:var(--text-secondary);margin-bottom:8px;}
  .tile .tile-value{font-size:28px;font-weight:700;line-height:1;}
  .tile .tile-sub{font-size:12.5px;color:var(--text-secondary);margin-top:6px;}

  .dist-bar-wrap{margin-top:6px;}
  .dist-bar{display:flex;width:100%;height:34px;border-radius:3px;overflow:hidden;border:1px solid var(--border);}
  .dist-seg{height:100%;transition:width .5s ease;}
  .dist-legend{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap;font-size:12.5px;}
  .dist-legend .item{display:flex;align-items:center;gap:6px;}
  .dist-legend .swatch{width:10px;height:10px;border-radius:2px;display:inline-block;}

  .duration-row{display:grid;grid-template-columns:170px 1fr 160px;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);}
  .duration-row:last-child{border-bottom:none;}
  .duration-label{font-size:13px;font-weight:600;}
  .duration-bar-track{background:#EEF1F3;border-radius:3px;height:16px;position:relative;}
  .duration-bar-fill{height:100%;border-radius:3px;transition:width .5s ease;}
  .duration-benchmark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text-secondary);}
  .duration-value{font-size:13px;text-align:right;}
  .duration-value .benchmark-note{display:block;font-size:11.5px;color:var(--text-secondary);font-weight:400;}

  .quality-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .quality-card{border:1px solid var(--border);border-radius:3px;padding:16px;}
  .quality-card .q-title{font-size:13px;font-weight:600;margin-bottom:8px;}
  .quality-card .q-value{font-size:24px;font-weight:700;margin-bottom:8px;}
  .quality-card.warning .q-value{color:var(--warning);}
  .q-progress-track{background:#EEF1F3;border-radius:3px;height:10px;position:relative;margin-bottom:6px;}
  .q-progress-fill{height:100%;border-radius:3px;background:var(--track-simplified);transition:width .5s ease;}
  .quality-card.warning .q-progress-fill{background:var(--warning);}
  .q-limit-marker{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);}
  .q-note{font-size:12px;color:var(--text-secondary);}
  .q-note.warning-note{color:var(--warning);font-weight:600;}

  .events-explain{color:var(--text-secondary);font-size:12.5px;margin-bottom:12px;}
  table.events-table th,table.events-table td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;white-space:nowrap;}
  table.events-table thead th{background:#F0F3F5;color:var(--text-secondary);font-weight:600;font-size:12.5px;}
  table.events-table tbody tr:last-child td{border-bottom:none;}
  table.events-table .event-expert{color:var(--text-secondary);}
  table.events-table tbody tr.new-event{animation:eventIn .4s ease;}
  @keyframes eventIn{from{opacity:0;background:#EAF3EF;}to{opacity:1;background:transparent;}}

  /* ===== Тосты ===== */
  #toast-container{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:360px;}
  .toast{
    background:#fff;border-left:4px solid var(--accent);border-radius:3px;box-shadow:0 3px 12px rgba(0,0,0,.15);
    padding:12px 16px;font-size:13px;opacity:0;transform:translateX(20px);transition:opacity .25s,transform .25s;
  }
  .toast.show{opacity:1;transform:translateX(0);}
  .toast.hide{opacity:0;transform:translateX(20px);}
  .toast.toast-success{border-left-color:var(--track-simplified);}
  .toast.toast-warning{border-left-color:var(--warning);}
  .toast.toast-info{border-left-color:var(--accent);}

  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
</style>

<div id="app-root"></div>
<div id="toast-container" aria-live="polite"></div>

<script>
'use strict';

/* =====================================================================
   1. ДАННЫЕ И КОНСТАНТЫ
   Все параметры генерации, веса скоринга и настройки — здесь.
   Значения подобраны так, чтобы фактическое распределение треков
   соответствовало требованиям ТЗ (раздел 3.4): проверено расчётом
   на фиксированном seed перед сборкой.
   ===================================================================== */

const CONFIG = {
  SEED: 4388,                     // сид генератора псевдослучайных чисел (детерминированный датасет)
  TOTAL_APPLICATIONS: 240,
  PAGE_SIZE: 25,
  THRESHOLD: 0.82,                // порог маршрутизации (см. раздел 4, шаг 4 ТЗ)
  THRESHOLD_SET_DATE: '12.03.2026',
  PRE_TRANSFERRED_COUNT: 2,       // заявления упрощённого трека, "уже переведённые" ранее в отчётном месяце (исходное состояние демо)
  TRANSFER_RATE_LIMIT: 0.08,      // граница нормы: доля переводов упрощённый → полный
  REVIEW_RATE_LIMIT: 0.03,        // граница нормы: доля пересмотренных решений упрощённого трека
  REVIEW_RATE_STATIC: 0.012,      // статичный показатель для демонстрации (вне интерактивного сценария)
  DURATION_BENCHMARKS: { simplified: 9, fullOffsite: 21, fullOnsite: 27 },
  ONSITE_SHARE: 0.32,             // доля дел полного трека, рассматриваемых очно (для агрегатов мониторинга)
  EVENTS_VISIBLE: 12,
};

// Веса формулы скоринга (раздел 4, шаг 3 ТЗ). Базовое значение S = 0.50.
// Примечание: «Форма направления» исключена из формулы по решению заказчика —
// поле остаётся в данных заявления и в правиле отказа от оценки (см. Шаг 2),
// но больше не влияет на балл и не показывается как фактор.
const SCORE_BASE = 0.50;
const SCORE_WEIGHTS = {
  packageCompleteness: { 'Полный': 0.14, 'Есть замечания': 0.00, 'Неполный': 0.00 },
  examinations: { 'В полном объёме': 0.12, 'Частично, требуется дообследование': -0.06 },
  examAge: { 'до 3 месяцев': 0.08, '3–6 месяцев': 0.00, 'более 6 месяцев': -0.10 },
  examTypeCombined: {
    'Повторное, группа не менялась': 0.10,
    'Повторное, группа менялась': 0.02,
    'Первичное': -0.02,
  },
  orgCount: { '1': 0.07, '2': 0.00, '3 и более': -0.07 },

/* =====================================================================
   2. ГЕНЕРАЦИЯ ДАННЫХ (детерминированная, seeded PRNG)
   ===================================================================== */

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function weightedChoice(rng, items) {
  const total = items.reduce((s, it) => s + it[1], 0);
  let r = rng() * total;
  for (const [value, w] of items) {
    if (r < w) return value;
    r -= w;
  }
  return items[items.length - 1][0];
}

function randInt(rng, min, max) { return Math.floor(rng() * (max - min + 1)) + min; }

function shuffle(rng, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pad(n, len) { return String(n).padStart(len, '0'); }

function addDays(date, delta) {
  const d = new Date(date);
  d.setDate(d.getDate() + delta);
  return d;
}

function formatDate(d) {
  return `${pad(d.getDate(), 2)}.${pad(d.getMonth() + 1, 2)}.${d.getFullYear()}`;
}

function formatDateTime(d) {
  return `${pad(d.getHours(), 2)}:${pad(d.getMinutes(), 2)}`;
}

function scoreApplication(app) {
  let s = SCORE_BASE;
  s += SCORE_WEIGHTS.packageCompleteness[app.packageCompleteness];
  s += SCORE_WEIGHTS.examinations[app.examinations];
  s += SCORE_WEIGHTS.examAge[app.examAge];
  s += SCORE_WEIGHTS.examTypeCombined[app.examTypeScoreKey];
  s += SCORE_WEIGHTS.orgCount[app.orgCount];
  s += SCORE_WEIGHTS.contradictions[app.contradictions];
  s += (SCORE_WEIGHTS.diagnosisConsistency[app.diagnosisConsistency] || 0);
  s += SCORE_WEIGHTS.nosology[app.nosology];
  s += SCORE_WEIGHTS.ageGroup[app.ageGroup];
  return Math.min(0.98, Math.max(0.02, s));
}

// Полный перечень факторов маршрутизации заявления — не только сильнейшие по
// модулю вклада, а весь набор признаков, которые модель принимает во внимание
// (за вычетом нозологии и возрастной группы — см. примечание к FACTOR_LABELS).
// Порядок фиксированный — совпадает с порядком применения признаков в
// формуле скоринга, — чтобы карточки было легко сравнивать между собой.
function computeFactors(app) {
  const dims = [
    ['packageCompleteness', app.packageCompleteness],
    ['examinations', app.examinations],
    ['examAge', app.examAge],
    ['examTypeCombined', app.examTypeScoreKey],
    ['orgCount', app.orgCount],
    ['contradictions', app.contradictions],
    ['diagnosisConsistency', app.diagnosisConsistency],
  ];
  const factors = [];
  for (const [dim, value] of dims) {
    const weight = SCORE_WEIGHTS[dim][value] || 0;
    const label = FACTOR_LABELS[dim] && FACTOR_LABELS[dim][value];
    if (!label) continue; // случаи, гасимые ещё на Шаге 2 (Неполный, Отсутствуют, расхождение в диагнозе) сюда не доходят
    factors.push({
      name: FACTOR_NAMES[dim],
      label,
      direction: weight > 0.0001 ? 'positive' : weight < -0.0001 ? 'negative' : 'neutral',
    });
  }
  return factors;
}

// Срок рассмотрения (deadlineType) и трек обработки (track) — независимые
// измерения. Нормативное исключение задаёт только срок и не прерывает и не
// подменяет собой дальнейший расчёт: возможность оценки и скоринг применяются
// к таким заявлениям наравне со всеми остальными (раздел 4 ТЗ, версия 2).
// Порядок: (1) срок по нормативному исключению → (2) проверка возможности
// оценки (в т.ч. согласованность диагноза и распознавание ключевых
// документов) → (3) скоринг → (4) трек по порогу.
function assignTrack(app) {
  const deadlineType = app.exclusion !== 'Нет' ? 'reduced' : 'normal';
  if (
    app.packageCompleteness === 'Неполный' ||
    (app.contradictions === 'Выявлены' && app.referralForm === 'Скан-копия')
  ) {
    return { track: 'full', deadlineType, reasonCode: 'no-assessment', noAssessmentReason: 'insufficient-data' };
  }
  if (app.diagnosisConsistency === 'Расхождение в основном диагнозе') {
    return { track: 'full', deadlineType, reasonCode: 'no-assessment', noAssessmentReason: 'diagnosis-mismatch' };
  }
  const keyDocsUnrecognized = app.documents.some(
    (d) => KEY_DOC_NAMES.includes(d.name) && d.status !== 'Распознан'
  );
  if (keyDocsUnrecognized) {
    return { track: 'full', deadlineType, reasonCode: 'no-assessment', noAssessmentReason: 'key-docs-unrecognized' };
  }
  const score = scoreApplication(app);
  if (score >= CONFIG.THRESHOLD) {
    return { track: 'simplified', deadlineType, reasonCode: 'score', score };
  }
  return { track: 'full', deadlineType, reasonCode: 'score', score };
}

// Статус рассмотрения заявления — самостоятельное измерение, не связанное с
// треком: "Ожидает рассмотрения" / "На рассмотрении" / "Принято решение".
// Только заявления со статусом "Ожидает рассмотрения" открываются в карточке —
// это единственный статус, за который в прототипе отвечает данный модуль
// (сам ход рассмотрения и формирование протокола — вне периметра работы).
const REVIEW_STATUS = {
  PENDING: 'Ожидает рассмотрения',
  IN_REVIEW: 'На рассмотрении',
  DECIDED: 'Принято решение',
};

// Порядок для мультивыбора фильтра и для сортировки колонки "Статус" —
// по ходу рассмотрения, а не по алфавиту.
const REVIEW_STATUS_LIST = [REVIEW_STATUS.PENDING, REVIEW_STATUS.IN_REVIEW, REVIEW_STATUS.DECIDED];
const STATUS_SORT_ORDER = { [REVIEW_STATUS.PENDING]: 0, [REVIEW_STATUS.IN_REVIEW]: 1, [REVIEW_STATUS.DECIDED]: 2 };
const DEADLINE_SORT_ORDER = { normal: 0, reduced: 1 };

// "Ожидает рассмотрения" — подавляющее большинство (~70%), чтобы кликабельное
// заявление в демонстрации не приходилось долго искать. Остаток распределён между
// "На рассмотрении" и "Принято решение" со сдвигом по давности заявления (чем
// "старше" заявление, тем выше шанс, что решение уже принято).
function pickReviewStatus(rng, daysAgo) {
  if (daysAgo <= 9) {
    return weightedChoice(rng, [
      [REVIEW_STATUS.PENDING, 0.70], [REVIEW_STATUS.IN_REVIEW, 0.25], [REVIEW_STATUS.DECIDED, 0.05],
    ]);
  }
  if (daysAgo <= 19) {
    return weightedChoice(rng, [
      [REVIEW_STATUS.PENDING, 0.70], [REVIEW_STATUS.IN_REVIEW, 0.18], [REVIEW_STATUS.DECIDED, 0.12],
    ]);
  }
  return weightedChoice(rng, [
    [REVIEW_STATUS.PENDING, 0.68], [REVIEW_STATUS.IN_REVIEW, 0.12], [REVIEW_STATUS.DECIDED, 0.20],
  ]);
}

// Согласованность диагноза между направлением и приложенными документами.
// Правила генерации (задание заказчика):
// - при выявленных противоречиях полное совпадение невозможно
// - при одном источнике документации совпадение ожидаемо (≥0.9)
// - при трёх и более источниках вероятность полного совпадения падает (~0.6)
function pickDiagnosisConsistency(rng, app) {
  if (app.contradictions === 'Выявлены') {
    return weightedChoice(rng, [
      ['Расхождение в формулировках', 0.85],
      ['Расхождение в основном диагнозе', 0.15],
    ]);
  }
  if (app.orgCount === '1') {
    return weightedChoice(rng, [
      ['Полное совпадение', 0.94],
      ['Расхождение в формулировках', 0.05],
      ['Расхождение в основном диагнозе', 0.01],
    ]);
  }
  if (app.orgCount === '3 и более') {
    return weightedChoice(rng, [
      ['Полное совпадение', 0.60],
      ['Расхождение в формулировках', 0.35],
      ['Расхождение в основном диагнозе', 0.05],
    ]);
  }
  return weightedChoice(rng, [
    ['Полное совпадение', 0.83],
    ['Расхождение в формулировках', 0.15],
    ['Расхождение в основном диагнозе', 0.02],
  ]);
}

function generateDocuments(rng, app, refDate) {
  const docs = [];
  const pushDoc = (name, opts = {}) => {
    const isKey = KEY_DOC_NAMES.includes(name);
    const format = opts.format || (rng() < 0.55 ? 'СЭМД' : 'Скан-копия PDF');
    const docDate = opts.date || addDays(refDate, -randInt(rng, 3, 180));
    const pages = opts.pages || randInt(rng, 1, 24);
    const status = opts.status || weightedChoice(rng, isKey ? KEY_DOC_STATUS_PROBS : OTHER_DOC_STATUS_PROBS);
    docs.push({ name, format, date: docDate, pages, status });
  };

  // Всегда присутствуют: базовые документы + ключевые (направление, заключение
  // специалиста; результаты обследований). Единственный случай отсутствия
  // документов в пакете — "Неполный" пакет (см. правило ниже).
  pushDoc(DOC_NAMES.referral, { format: app.referralForm === 'Скан-копия' ? 'Скан-копия PDF' : 'СЭМД' });
  pushDoc(DOC_NAMES.application);
  pushDoc(DOC_NAMES.consent);
  pushDoc(DOC_NAMES.specialist);
  pushDoc(DOC_NAMES.lab);
  pushDoc(DOC_NAMES.instrumental);

  // Прочий документ — присутствует не всегда (не влияет на решение об оценке)
  if (rng() < 0.6) pushDoc(DOC_NAMES.extract);

  // Повторное освидетельствование — дополнительные документы
  if (app.examType === 'Повторное') {
    pushDoc(DOC_NAMES.prevProtocol);
    pushDoc(DOC_NAMES.prevIpra);
  }

  // ~15% заявок — производственная травма
  if (app.isWorkInjury) {
    pushDoc(DOC_NAMES.workCharacteristic);
    pushDoc(DOC_NAMES.accidentAct);
  }

  // Согласованность: "Неполный" пакет → 1-2 документа помечаются как "не распознан"
  // (сам по себе Шаг 2 уже отправляет такое заявление на полный трек по причине
  // неполноты пакета — это лишь визуальное подтверждение в таблице документов)
  if (app.packageCompleteness === 'Неполный') {
    const eligible = docs.filter((d) => d.name !== DOC_NAMES.consent);
    const toMark = shuffle(rng, eligible).slice(0, randInt(rng, 1, 2));
    toMark.forEach((d) => { d.status = 'Не распознан'; });
  }

  return docs;
}

function buildApplication(index, rng, today) {
  const app = {};
  app.id = index;
  app.number = `2026-0${pad(index + 1, 4)}`;
  app.receivedDaysAgo = randInt(rng, 0, 30);
  app.receivedDate = addDays(today, -app.receivedDaysAgo);
  app.receivedTime = { h: randInt(rng, 8, 17), m: randInt(rng, 0, 59) };

  app.exclusion = weightedChoice(rng, GEN_PROBABILITIES.exclusion);
  app.examType = weightedChoice(rng, GEN_PROBABILITIES.examType);
  if (app.examType === 'Первичное') {
    app.prevExamStatus = 'Нет';
    app.examTypeScoreKey = 'Первичное';
  } else {
    app.prevExamStatus = weightedChoice(rng, GEN_PROBABILITIES.prevStatus);
    app.examTypeScoreKey = app.prevExamStatus === 'Есть, группа не менялась'
      ? 'Повторное, группа не менялась' : 'Повторное, группа менялась';
  }

  app.ageGroup = weightedChoice(rng, GEN_PROBABILITIES.ageGroup);
  app.nosology = weightedChoice(rng, GEN_PROBABILITIES.nosology);
  app.mainDiagnosis = pickMainDiagnosis(rng, app.nosology);
  app.applicantName = APPLICANT_NAME_POOL[randInt(rng, 0, APPLICANT_NAME_POOL.length - 1)];

  app.packageCompleteness = weightedChoice(rng, GEN_PROBABILITIES.pkg);
  app.examinations = app.packageCompleteness === 'Полный'
    ? weightedChoice(rng, GEN_PROBABILITIES.examIfPolny)
    : weightedChoice(rng, GEN_PROBABILITIES.examIfOther);

  app.examAge = weightedChoice(rng, GEN_PROBABILITIES.examAge);
  app.referralForm = weightedChoice(rng, GEN_PROBABILITIES.referralForm);
  app.orgCount = weightedChoice(rng, GEN_PROBABILITIES.orgCount);
  app.contradictions = weightedChoice(rng, GEN_PROBABILITIES.contradictions);
  app.diagnosisConsistency = pickDiagnosisConsistency(rng, app);
  app.isWorkInjury = rng() < 0.15;

  // Документы генерируются до маршрутизации: решение об отказе от оценки
  // (Шаг 2) зависит от статуса распознавания ключевых документов.
  app.documents = generateDocuments(rng, app, app.receivedDate);

  const assignment = assignTrack(app);
  app.track = assignment.track;
  app.deadlineType = assignment.deadlineType;
  app.reasonCode = assignment.reasonCode;
  app.noAssessmentReason = assignment.noAssessmentReason || null;
  app.factors = assignment.reasonCode !== 'no-assessment' ? computeFactors(app) : [];

  app.form = app.track === 'full' ? weightedChoice(rng, GEN_PROBABILITIES.onsiteForm) : null;

  // Статус рассмотрения не зависит от трека и не меняется переводом на полный
  // трек (перевод — это смена трека, а не стадии рассмотрения). Чем "старше"
  // заявление в пределах отчётного месяца, тем выше шанс, что оно уже в работе
  // или по нему принято решение.
  app.status = pickReviewStatus(rng, app.receivedDaysAgo);
  app.transferred = false;
  app.transferReason = null;
  app.transferDate = null;

  return app;
}

function buildDurationStats(rng) {
  const periods = ['week', 'month', 'quarter', 'year'];
  const tracks = ['simplified', 'fullOffsite', 'fullOnsite'];
  const stats = {};
  for (const period of periods) {
    stats[period] = {};
    for (const track of tracks) {
      const benchmark = CONFIG.DURATION_BENCHMARKS[track];
      const avg = Math.max(1, benchmark + (rng() - 0.5) * benchmark * 0.22);
      stats[period][track] = { avg: Math.round(avg * 10) / 10 };
    }
  }
  return stats;
}

// Сводка по потоку заявок (используется для плиток и полосы распределения
// на экране мониторинга). Отдельная функция — переиспользуется и для живых
// данных очереди (неделя/месяц), и для синтетической квартальной агрегации.
function computeFlowStatsFromList(apps) {
  const total = apps.length;
  const simplified = apps.filter((a) => a.track === 'simplified').length;
  const fullApps = apps.filter((a) => a.track === 'full');
  const reducedApps = apps.filter((a) => a.deadlineType === 'reduced');
  const fullOffsite = fullApps.filter((a) => a.form === 'заочно').length;
  const fullOnsite = fullApps.filter((a) => a.form === 'очно').length;
  return {
    total, simplified, full: fullApps.length, fullOffsite, fullOnsite,
    reduced: reducedApps.length,
    reducedSimplified: reducedApps.filter((a) => a.track === 'simplified').length,
    reducedFull: reducedApps.filter((a) => a.track === 'full').length,
  };
}

// "Квартал" не может быть выборкой из тех же 240 заявок — весь датасет
// охватывает только отчётный месяц (раздел 3.1 ТЗ), а дела прошлых месяцев
// уже закрыты и не висят в очереди. Поэтому квартал — самостоятельная,
// детерминированно сгенерированная агрегированная сводка (по аналогии со
// сроками рассмотрения), а не фильтр по очереди.
function buildScaledFlowStats(rng, monthStats, scaleBase, scaleJitter) {
  const scale = scaleBase + (rng() - 0.5) * scaleJitter;
  const total = Math.round(monthStats.total * scale);
  const simplifiedShare = Math.min(0.32, Math.max(0.20, monthStats.simplified / monthStats.total + (rng() - 0.5) * 0.03));
  const simplified = Math.round(total * simplifiedShare);
  const full = total - simplified;
  const onsiteShare = Math.min(0.45, Math.max(0.20, CONFIG.ONSITE_SHARE + (rng() - 0.5) * 0.06));
  const fullOnsite = Math.round(full * onsiteShare);
  const fullOffsite = full - fullOnsite;
  // Доля с сокращённым сроком удерживается около фактической (см. GEN_PROBABILITIES.exclusion,
  // суммарно ~5%); смешанное распределение по трекам внутри группы берётся из той же доли
  // упрощённого трека, что и по потоку в целом — так синтетическая сводка не рисует
  // 100% на одном треке.
  const reducedShare = Math.min(0.07, Math.max(0.03, monthStats.reduced / monthStats.total + (rng() - 0.5) * 0.015));
  const reduced = Math.round(total * reducedShare);
  const reducedSimplified = Math.round(reduced * simplifiedShare);
  const reducedFull = reduced - reducedSimplified;
  return { total, simplified, full, fullOffsite, fullOnsite, reduced, reducedSimplified, reducedFull };
}

function generateDataset() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const rng = mulberry32(CONFIG.SEED);
  const applications = [];
  for (let i = 0; i < CONFIG.TOTAL_APPLICATIONS; i++) {
    applications.push(buildApplication(i, rng, today));
  }

  // Исходное состояние демонстрации: часть заявок упрощённого трека уже
  // считается переведённой ранее в отчётном месяце — это даёт наглядную
  // отправную точку для показателя "доля переводов" (раздел 7, блок 3 ТЗ):
  // до превышения границы нормы (8%) остаётся 3–5 переводов вручную.
  const simplifiedApps = applications.filter((a) => a.track === 'simplified');
  const preTransferred = shuffle(rng, simplifiedApps).slice(0, CONFIG.PRE_TRANSFERRED_COUNT);
  preTransferred.forEach((a, idx) => {
    a.transferred = true;
    a.transferReason = weightedChoice(rng, GEN_PROBABILITIES.transferReason);
    a.transferDate = addDays(a.receivedDate, randInt(rng, 1, 5));
  });

  const durationStats = buildDurationStats(rng);
  const monthFlowBaseline = computeFlowStatsFromList(applications);
  const quarterFlowStats = buildScaledFlowStats(rng, monthFlowBaseline, 3.0, 0.4);
  // "Год" — та же логика синтетической агрегации, что и "Квартал" (см. комментарий
  // выше): за пределами отчётного месяца в очереди нет и не может быть реальных
  // заявок, все они уже закрыты.
  const yearFlowStats = buildScaledFlowStats(rng, monthFlowBaseline, 12.0, 1.0);

  // Начальная лента событий — строится из истории маршрутизации и переводов.
  // Категория и описание сознательно разведены (не пересказывают друг друга):
  // категория — короткий тип события, описание — конкретика по этому событию.
  const events = [];
  applications.forEach((a) => {
    const dt = new Date(a.receivedDate);
    dt.setHours(a.receivedTime.h, a.receivedTime.m, 0, 0);
    let category, description;
    if (a.reasonCode === 'no-assessment') {
      category = 'Отказ от оценки';
      description = `Оценка не сформирована: ${NO_ASSESSMENT_EVENT_REASON[a.noAssessmentReason]}`;
    } else if (a.track === 'simplified') {
      category = 'Назначение трека';
      description = 'Заявление направлено на упрощённый трек';
    } else {
      category = 'Назначение трека';
      description = 'Заявление направлено на полный трек';
    }
    if (a.deadlineType === 'reduced') {
      description += ` · Срок сокращён: ${lowerFirst(a.exclusion)}`;
    }
    events.push({ time: dt, appId: a.id, appNumber: a.number, category, description, expert: null });
    if (a.transferred) {
      const reasonDisplay = a.transferReason.charAt(0).toUpperCase() + a.transferReason.slice(1);
      events.push({
        time: a.transferDate ? new Date(a.transferDate.getTime() + a.receivedTime.h * 3600000) : dt,
        appId: a.id,
        appNumber: a.number,
        category: 'Перевод трека',
        description: `Упрощённый → Полный · ${reasonDisplay}`,
        expert: EXPERT_POOL[randInt(rng, 0, EXPERT_POOL.length - 1)],
      });
    }
  });
  events.sort((a, b) => b.time - a.time);

  return {
    applications,
    durationStats,
    quarterFlowStats,
    yearFlowStats,
    events: events.slice(0, CONFIG.EVENTS_VISIBLE),
  };
}

/* =====================================================================
   3. СОСТОЯНИЕ ПРИЛОЖЕНИЯ (хранится в памяти, без браузерного хранилища)
   ===================================================================== */

const dataset = generateDataset();

const state = {
  applications: dataset.applications,
  durationStats: dataset.durationStats,
  quarterFlowStats: dataset.quarterFlowStats,
  yearFlowStats: dataset.yearFlowStats,
  events: dataset.events,
  role: 'expert',            // 'expert' | 'head'
  screen: 'queue',           // 'queue' | 'card'
  headTab: 'monitoring',     // 'queue' | 'monitoring' (только для роли "Руководитель бюро")
  selectedAppId: null,
  filters: { track: 'all', deadline: 'all', type: 'all', status: [], statusPanelOpen: false, search: '' },
  sort: { field: 'date', dir: 'desc' },
  page: 1,
  monitoringPeriod: 'month', // 'week' | 'month' | 'quarter' | 'year'
  stubPanelOpen: false,
  transferModalAppId: null,

};

/* =====================================================================
   4. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ РЕНДЕРА
   ===================================================================== */

function esc(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

// Отображаемый трек учитывает ручной перевод эксперта: после перевода
// заявление визуально становится "Полный" — обратный переход недоступен.
function effectiveTrack(app) {
  if (app.transferred) return 'full';
  return app.track;
}

function trackBadgeClass(app) {
  return effectiveTrack(app) === 'simplified' ? 'badge-simplified' : 'badge-full';
}

function trackBadgeText(app) {
  return effectiveTrack(app) === 'simplified' ? 'Упрощённый' : 'Полный';
}

function lowerFirst(str) {
  return str.charAt(0).toLowerCase() + str.slice(1);
}

// Срок — независимый от трека признак; бейдж показывается только при
// сокращённом сроке (~5% заявлений), рядом с бейджем трека, а не вместо него.
function deadlineBadgeMarkup(app) {
  if (app.deadlineType !== 'reduced') return '';
  const reason = lowerFirst(app.exclusion);
  return `<span class="badge badge-deadline-reduced" title="Основание: ${esc(reason)}" aria-label="Сокращённый срок рассмотрения. Основание: ${esc(reason)}"><span class="deadline-badge-icon" aria-hidden="true">⏱</span>Сокращённый срок</span>`;
}

function animateCountUp(el, target, duration = 500) {
  const isPercent = el.dataset.percent === '1';
  const start = Number(el.dataset.currentValue || 0);
  const startTime = performance.now();
  function step(now) {
    const progress = Math.min(1, (now - startTime) / duration);
    const eased = 1 - Math.pow(1 - progress, 2);
    const value = start + (target - start) * eased;
    el.textContent = isPercent ? value.toFixed(1) + '%' : Math.round(value).toLocaleString('ru-RU');
    if (progress < 1) requestAnimationFrame(step);
    else el.dataset.currentValue = String(target);
  }
  requestAnimationFrame(step);
}

function applyCountUps(root) {
  root.querySelectorAll('[data-countup]').forEach((el) => {
    const target = Number(el.dataset.countup);
    animateCountUp(el, target);
  });
}

/* =====================================================================
   5. ТОСТЫ (УВЕДОМЛЕНИЯ)
   ===================================================================== */

function showToast(type, text) {
  const container = document.getElementById('toast-container');
  const id = 'toast-' + (++toastSeq);
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.id = id;
  el.setAttribute('role', 'status');
  el.textContent = text;
  container.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.add('hide');
    el.classList.remove('show');
    setTimeout(() => el.remove(), 260);
  }, 4000);
}

   ===================================================================== */

function renderHeader() {
  const today = formatDate(new Date());
  return `
    <header class="app-header">
      <div class="system-name">ЕАВИИАС МСЭ</div>
      <div class="module-name">Заявления на МСЭ</div>

        <button type="button" data-action="set-role" data-role="expert" class="${state.role === 'expert' ? 'active' : ''}" aria-pressed="${state.role === 'expert'}">Эксперт бюро</button>
        <button type="button" data-action="set-role" data-role="head" class="${state.role === 'head' ? 'active' : ''}" aria-pressed="${state.role === 'head'}">Руководитель бюро</button>
