// Руководитель бюро видит два экрана через внутренние вкладки: "Очередь"
// (только просмотр — без действий эксперта) и "Мониторинг" (по умолчанию).
// Эксперт бюро, как и раньше, работает в едином потоке Очередь → Карточка.
function renderHeadTabs() {
  return `
    <div class="head-tabs" role="group" aria-label="Экраны руководителя">
      <button type="button" data-action="set-head-tab" data-tab="queue" aria-pressed="${state.headTab === 'queue'}" class="${state.headTab === 'queue' ? 'active' : ''}">Очередь заявок</button>
      <button type="button" data-action="set-head-tab" data-tab="monitoring" aria-pressed="${state.headTab === 'monitoring'}" class="${state.headTab === 'monitoring' ? 'active' : ''}">Мониторинг</button>
    </div>
  `;
}

function render() {
  const root = document.getElementById('app-root');
  let body;
  if (state.role === 'expert') {
    body = state.screen === 'card' ? renderCardScreen() : renderQueueScreen();
  } else if (state.headTab === 'queue') {
    body = renderHeadTabs() + (state.screen === 'card' ? renderCardScreen() : renderQueueScreen());
  } else {
    body = renderHeadTabs() + renderMonitoringScreen();
  }
  root.innerHTML = `${renderHeader()}<main id="app-body" class="screen-fade">${body}</main>${renderInfoModal()}`;
  applyCountUps(root);
  attachHandlers();
}

/* =====================================================================
   7. РЕНДЕР: ОЧЕРЕДЬ ЗАЯВОК (роль: эксперт бюро)
   ===================================================================== */

function getFilteredApplications() {
  let list = state.applications;
  if (state.filters.track !== 'all') {
    list = list.filter((a) => a.track === state.filters.track);
  }
  if (state.filters.deadline !== 'all') {
    list = list.filter((a) => a.deadlineType === state.filters.deadline);
  }
  if (state.filters.type !== 'all') {
    list = list.filter((a) => a.examType === state.filters.type);
  }
  if (state.filters.status.length > 0) {
    list = list.filter((a) => state.filters.status.includes(a.status));
  }
  if (state.filters.search.trim()) {
    const q = state.filters.search.trim().toLowerCase();
    list = list.filter((a) => a.number.toLowerCase().includes(q));
  }
  const dir = state.sort.dir === 'asc' ? 1 : -1;
  const trackOrder = { simplified: 0, full: 1 };
  list = list.slice().sort((a, b) => {
    if (state.sort.field === 'date') return (a.receivedDate - b.receivedDate) * dir;
    if (state.sort.field === 'type') return a.examType.localeCompare(b.examType, 'ru') * dir;
    if (state.sort.field === 'nosology') return a.nosology.localeCompare(b.nosology, 'ru') * dir;
    if (state.sort.field === 'track') return (trackOrder[a.track] - trackOrder[b.track]) * dir;
    if (state.sort.field === 'deadline') return (DEADLINE_SORT_ORDER[a.deadlineType] - DEADLINE_SORT_ORDER[b.deadlineType]) * dir;
    if (state.sort.field === 'status') return (STATUS_SORT_ORDER[a.status] - STATUS_SORT_ORDER[b.status]) * dir;
    return 0;
  });
  return list;
}

function renderQueueScreen() {
  const filtered = getFilteredApplications();
  const total = filtered.length;
  const pageCount = Math.max(1, Math.ceil(total / CONFIG.PAGE_SIZE));
  const page = Math.min(state.page, pageCount);
  const pageItems = filtered.slice((page - 1) * CONFIG.PAGE_SIZE, page * CONFIG.PAGE_SIZE);

  const simplifiedN = filtered.filter((a) => a.track === 'simplified').length;
  const fullN = filtered.filter((a) => a.track === 'full').length;
  const reducedDeadlineN = filtered.filter((a) => a.deadlineType === 'reduced').length;

  const sortArrow = (field) => state.sort.field === field
    ? `<span class="sort-icon active">${state.sort.dir === 'asc' ? '▲' : '▼'}</span>`
    : `<span class="sort-icon">⇅</span>`;

  function statusFilterSummary() {
    const n = state.filters.status.length;
    if (n === 0) return 'Все статусы';
    if (n === 1) return state.filters.status[0];
    return `Выбрано: ${n}`;
  }

  return `
    <h1 class="screen-title">Очередь заявок</h1>
    <div class="panel">
      <div class="filters-bar">
        <div class="filter-field">
          <label for="filter-track">Трек</label>
          <select id="filter-track" data-action="filter-track">
            <option value="all" ${state.filters.track === 'all' ? 'selected' : ''}>Все треки</option>
            <option value="simplified" ${state.filters.track === 'simplified' ? 'selected' : ''}>Упрощённый</option>
            <option value="full" ${state.filters.track === 'full' ? 'selected' : ''}>Полный</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="filter-deadline">Срок</label>
          <select id="filter-deadline" data-action="filter-deadline">
            <option value="all" ${state.filters.deadline === 'all' ? 'selected' : ''}>Все</option>
            <option value="normal" ${state.filters.deadline === 'normal' ? 'selected' : ''}>Обычный</option>
            <option value="reduced" ${state.filters.deadline === 'reduced' ? 'selected' : ''}>Сокращённый</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="filter-type">Тип освидетельствования</label>
          <select id="filter-type" data-action="filter-type">
            <option value="all" ${state.filters.type === 'all' ? 'selected' : ''}>Все типы</option>
            <option value="Первичное" ${state.filters.type === 'Первичное' ? 'selected' : ''}>Первичное</option>
            <option value="Повторное" ${state.filters.type === 'Повторное' ? 'selected' : ''}>Повторное</option>
          </select>
        </div>
        <div class="filter-field">
          <span id="status-filter-label">Статус</span>
          <details class="status-filter" data-action="status-filter" ${state.filters.statusPanelOpen ? 'open' : ''}>
            <summary aria-labelledby="status-filter-label">${statusFilterSummary()}</summary>
            <div class="status-filter-options">
              ${REVIEW_STATUS_LIST.map((s) => `
                <label class="status-filter-option">
                  <input type="checkbox" data-action="filter-status-checkbox" value="${esc(s)}" ${state.filters.status.includes(s) ? 'checked' : ''}>
                  ${esc(s)}
                </label>
              `).join('')}
            </div>
          </details>
        </div>
        <div class="filter-field">
          <label for="filter-search">Поиск по номеру заявления</label>
          <input id="filter-search" type="search" data-action="filter-search" placeholder="2026-00001" value="${esc(state.filters.search)}">
        </div>
      </div>
    </div>

    <div class="summary-line">
      <span>Всего заявок: <b data-countup="${total}" data-current-value="${total}">${total}</b></span>
      <span class="sep">·</span>
      <span>Упрощённый трек: <b data-countup="${simplifiedN}" data-current-value="${simplifiedN}">${simplifiedN}</b></span>
      <span class="sep">·</span>
      <span>Полный трек: <b data-countup="${fullN}" data-current-value="${fullN}">${fullN}</b></span>
      <span class="sep">·</span>
      <span>С сокращённым сроком: <b data-countup="${reducedDeadlineN}" data-current-value="${reducedDeadlineN}">${reducedDeadlineN}</b></span>
    </div>

    <div class="table-wrap">
      <table class="queue-table">
        <caption class="visually-hidden">Список заявок на медико-социальную экспертизу</caption>
        <thead>
          <tr>
            <th>№ заявления</th>
            <th class="sortable" data-action="sort" data-field="date" tabindex="0" role="button" aria-label="Сортировать по дате поступления">Дата поступления${sortArrow('date')}</th>
            <th class="sortable" data-action="sort" data-field="type" tabindex="0" role="button" aria-label="Сортировать по типу освидетельствования">Тип${sortArrow('type')}</th>
            <th class="sortable" data-action="sort" data-field="nosology" tabindex="0" role="button" aria-label="Сортировать по группе нозологий">Группа нозологий${sortArrow('nosology')}</th>
            <th class="sortable" data-action="sort" data-field="track" tabindex="0" role="button" aria-label="Сортировать по треку">Назначенный трек${sortArrow('track')}</th>
            <th class="sortable" data-action="sort" data-field="deadline" tabindex="0" role="button" aria-label="Сортировать по сроку рассмотрения">Срок${sortArrow('deadline')}</th>
            <th class="sortable" data-action="sort" data-field="status" tabindex="0" role="button" aria-label="Сортировать по статусу">Статус${sortArrow('status')}</th>
          </tr>
        </thead>
        <tbody>
          ${pageItems.map((a) => `
            <tr data-action="open-card-row" data-id="${a.id}">
              <td><button type="button" class="link-button link-button-plain" data-action="open-card" data-id="${a.id}">${esc(a.number)}</button></td>
              <td>${formatDate(a.receivedDate)}</td>
              <td>${esc(a.examType)}</td>
              <td>${esc(a.nosology)}</td>
              <td>
                <span class="badge ${trackBadgeClass(a)}">${trackBadgeText(a)}</span>
                ${a.reasonCode === 'no-assessment'
                  ? `<span class="no-assess-flag" role="img" aria-label="${esc(NO_ASSESSMENT_SHORT[a.noAssessmentReason])}" title="${esc(NO_ASSESSMENT_SHORT[a.noAssessmentReason])}">i</span>` : ''}
              </td>
              <td>${deadlineBadgeMarkup(a) || '—'}</td>
              <td>${esc(a.status)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <button type="button" data-action="page" data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''}>‹ Назад</button>
      ${Array.from({ length: pageCount }, (_, i) => i + 1).map((p) => `
        <button type="button" data-action="page" data-page="${p}" class="${p === page ? 'active' : ''}">${p}</button>
      `).join('')}
      <button type="button" data-action="page" data-page="${page + 1}" ${page >= pageCount ? 'disabled' : ''}>Вперёд ›</button>
      <span class="page-info">Всего записей: ${total}</span>
    </div>
  `;
}

/* =====================================================================
   8. РЕНДЕР: КАРТОЧКА ЗАЯВКИ (роль: эксперт бюро)
   ===================================================================== */

// Поля, дублирующие блок "Факторы маршрутизации заявления" (полнота пакета,
// достаточность обследований, давность, число медорганизаций, противоречия,
// согласованность диагноза), намеренно не показаны здесь во второй раз —
// они остаются в модели данных и в скоринге, отображаются только в факторах.
// Порядок — по смысловым группам, не по случаю добавления в код:
// регистрационные данные → тип и история освидетельствования →
// демография → клиника → административные сведения.
const FIELD_DEFS = [
  ['Номер заявления', (a) => a.number],
  ['ФИО заявителя', (a) => a.applicantName],
  ['Дата поступления', (a) => formatDate(a.receivedDate)],
  ['Тип освидетельствования', (a) => a.examType],
  ['Возрастная группа', (a) => a.ageGroup],
  ['Предыдущие освидетельствования', (a) => a.prevExamStatus],
  ['Группа нозологий', (a) => a.nosology],
  ['Основной диагноз', (a) => a.mainDiagnosis],
  ['Форма направления', (a) => a.referralForm],
];

function docStatusMarkup(status) {
  const cls = status === 'Распознан' ? 'status-ok' : status === 'Распознан частично' ? 'status-partial' : 'status-fail';
  return `<span class="doc-status ${cls}"><span class="dot"></span>${esc(status)}</span>`;
}

function trackExplanationBase(a) {
  if (a.transferred) return 'Заявление переведено экспертом на полный трек; рассмотрение проводится в общем порядке';
  if (a.reasonCode === 'no-assessment') return `Рассмотрение в общем порядке. ${NO_ASSESSMENT_SHORT[a.noAssessmentReason]}`;
  if (a.track === 'simplified') return 'Рассмотрение проводится заочно в упрощённом порядке';
  return 'Рассмотрение в общем порядке';
}

function trackExplanationLine(a) {
  const base = trackExplanationBase(a);
  if (a.deadlineType === 'reduced') {
    return `${base} · Срок рассмотрения сокращён: ${lowerFirst(a.exclusion)}`;
  }
  return base;
}

// Значки направления фактора. Направление не передаётся только цветом —
// у значков разная форма (круг со «птичкой» / треугольник с восклицательным
// знаком / нейтральный кружок с тире), чтобы различие было понятно и без
// восприятия цвета. Нейтральный — для значений с нулевым вкладом в балл
// (например, "Есть замечания" или "3–6 месяцев"): они не двигают оценку
// ни в одну из сторон, но всё равно входят в полный перечень факторов.
// В строках таблицы значок — единственный носитель направления в этой
// строке, поэтому там ему нужна собственная подпись для скринридера;
// в легенде рядом уже есть текст, поэтому там значок декоративный.
const FACTOR_DIRECTION_LABEL = {
  positive: 'Фактор в пользу упрощённого рассмотрения заявления',
  negative: 'Фактор в пользу полноценного рассмотрения заявления',
  neutral: 'Фактор не влияет на выбор трека',
};

function factorIcon(direction, decorative) {
  const attrs = decorative ? 'aria-hidden="true"' : `role="img" aria-label="${esc(FACTOR_DIRECTION_LABEL[direction])}"`;
  if (direction === 'positive') {
    return `<svg class="factor-icon" viewBox="0 0 20 20" ${attrs}>
      <circle cx="10" cy="10" r="9" style="fill:var(--track-simplified)"/>
      <path d="M6 10.3l2.6 2.6L14.2 7" fill="none" style="stroke:#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }
  if (direction === 'negative') {
    return `<svg class="factor-icon" viewBox="0 0 20 20" ${attrs}>
      <path d="M10 2L18.6 17H1.4L10 2Z" style="fill:var(--warning)"/>
      <rect x="9.25" y="7.3" width="1.5" height="4.4" style="fill:#fff"/>
      <rect x="9.25" y="12.8" width="1.5" height="1.5" style="fill:#fff"/>
    </svg>`;
  }
  return `<svg class="factor-icon" viewBox="0 0 20 20" ${attrs}>
    <circle cx="10" cy="10" r="9" style="fill:var(--track-full)"/>
    <rect x="6" y="9.25" width="8" height="1.5" style="fill:#fff"/>
  </svg>`;
}

function renderFactorsBlock(a) {
  if (a.reasonCode === 'no-assessment') {
    return `<div class="no-assess-message">${esc(NO_ASSESSMENT_MESSAGES[a.noAssessmentReason])}</div>`;
  }
  return `
    <table class="factors-table">
      <caption class="visually-hidden">Факторы, учтённые при маршрутизации заявления ${esc(a.number)}</caption>
      <thead><tr><th>Фактор</th><th>Что обнаружено</th></tr></thead>
      <tbody>
        ${a.factors.map((f) => `
          <tr>
            <td class="factor-name">${esc(f.name)}</td>
            <td>
              <span class="factor-detail">
                ${factorIcon(f.direction, false)}
                <span>${esc(f.label)}</span>
              </span>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    <div class="factors-legend">
      <span class="legend-item">${factorIcon('positive', true)}${esc(FACTOR_DIRECTION_LABEL.positive)}</span>
      <span class="legend-item">${factorIcon('negative', true)}${esc(FACTOR_DIRECTION_LABEL.negative)}</span>
      <span class="legend-item">${factorIcon('neutral', true)}${esc(FACTOR_DIRECTION_LABEL.neutral)}</span>
    </div>
  `;
}

function renderCardScreen() {
  const a = state.applications.find((x) => x.id === state.selectedAppId);
  if (!a) return `<p>Заявление не найдено.</p>`;
  const recognizedCount = a.documents.filter((d) => d.status === 'Распознан').length;
  const failedCount = a.documents.filter((d) => d.status === 'Не распознан').length;
  const canTransfer = state.role === 'expert' && a.track === 'simplified' && !a.transferred;

  return `
    <div class="card-topbar">
      <button type="button" class="btn" data-action="back-to-queue">‹ Вернуться к очереди</button>
    </div>

    <div class="panel">
      <div class="card-header-block">
        <div class="meta">
          <h1 class="app-number">${esc(a.number)}</h1>
          <div class="app-date">Дата поступления: ${formatDate(a.receivedDate)}</div>
        </div>
        <div class="track-badge-wrap">
          <span class="track-badge-label">Назначенный трек</span>
          <span class="badge badge-lg ${trackBadgeClass(a)}">${trackBadgeText(a)}</span>
          ${a.deadlineType === 'reduced' ? `<span class="badge badge-lg badge-deadline-reduced" title="Основание: ${esc(lowerFirst(a.exclusion))}" aria-label="Сокращённый срок рассмотрения. Основание: ${esc(lowerFirst(a.exclusion))}"><span class="deadline-badge-icon" aria-hidden="true">⏱</span>Сокращённый срок</span>` : ''}
        </div>
      </div>
      <div class="card-track-explain ${a.deadlineType === 'reduced' ? 'deadline-reduced-note' : ''}">${trackExplanationLine(a)}</div>
    </div>

    <div class="panel">
      <h2 class="block-title">Сведения по заявлению</h2>
      <dl class="field-grid">
        ${FIELD_DEFS.map(([label, fn]) => `
          <div class="field-row"><dt class="field-name">${label}</dt><dd class="field-value">${esc(fn(a))}</dd></div>
        `).join('')}
      </dl>
    </div>

    <div class="panel">
      <h2 class="block-title">Приложенные документы</h2>
      <div class="docs-summary">Документов: ${a.documents.length} · Распознано: ${recognizedCount} · Не распознано: ${failedCount}</div>
      <table class="docs-table">
        <caption class="visually-hidden">Приложенные документы заявления ${esc(a.number)}</caption>
        <thead>
          <tr><th>Наименование</th><th>Формат</th><th>Дата</th><th>Объём (стр.)</th><th>Статус обработки</th></tr>
        </thead>
        <tbody>
          ${a.documents.map((d, i) => {
            const isKeyIssue = KEY_DOC_NAMES.includes(d.name) && d.status !== 'Распознан';
            return `
            <tr class="${isKeyIssue ? 'key-doc-issue' : ''}" data-action="open-doc-stub-row" data-idx="${i}">
              <td><button type="button" class="link-button" data-action="open-doc-stub" data-idx="${i}">${esc(d.name)}</button>${isKeyIssue ? '<span class="key-doc-tag">Ключевой</span>' : ''}</td>
              <td>${esc(d.format)}</td>
              <td>${formatDate(d.date)}</td>
              <td>${d.pages}</td>
              <td>${docStatusMarkup(d.status)}</td>
            </tr>
          `;
          }).join('')}
        </tbody>
      </table>
    </div>

    <div class="panel">
      <h2 class="block-title">Факторы маршрутизации заявления</h2>
      ${renderFactorsBlock(a)}
    </div>

    ${state.role === 'expert' ? `
      <div class="panel">
        <button type="button" class="btn btn-primary" data-action="open-transfer-modal" data-id="${a.id}" ${canTransfer ? '' : 'disabled'}>
          ${a.transferred ? 'Заявление переведено на полный трек' : 'Перевести на полный трек'}
        </button>
      </div>
    ` : ''}

    ${renderStubPanel(a)}
    ${state.role === 'expert' ? renderTransferModal() : ''}
  `;
}

function renderStubPanel(a) {
  const doc = state.stubPanelOpen !== false ? a.documents[state.stubPanelOpen] : null;
  const open = state.stubPanelOpen !== false;
  return `
    <div class="stub-overlay ${open ? 'open' : ''}" data-action="close-stub"></div>
    <div class="stub-panel ${open ? 'open' : ''}" role="dialog" aria-label="Просмотр документа" aria-hidden="${!open}">
      <h3>${doc ? esc(doc.name) : ''}</h3>
      <p>Просмотр документа доступен в основном интерфейсе ЕАВИИАС МСЭ.</p>
      <div style="margin-top:auto;">
        <button type="button" class="btn" data-action="close-stub">Закрыть</button>
      </div>
    </div>
  `;
}

function renderTransferModal() {
  const open = state.transferModalAppId !== null;
  return `
    <div class="modal-overlay ${open ? 'open' : ''}" role="dialog" aria-modal="true" aria-labelledby="transfer-modal-title" aria-hidden="${!open}">
      <div class="modal-box">
        <h3 id="transfer-modal-title">Перевод заявления на полный трек</h3>
        <label for="transfer-reason">Причина перевода</label>
        <select id="transfer-reason">
          <option value="требуется дообследование">Требуется дообследование</option>
          <option value="неполнота сведений">Неполнота сведений</option>
          <option value="выявлены противоречия">Выявлены противоречия</option>
          <option value="иное">Иное</option>
        </select>
        <div id="transfer-reason-other-wrap" hidden>
          <label for="transfer-reason-other">Уточните причину</label>
          <input type="text" id="transfer-reason-other" placeholder="Опишите причину перевода">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" data-action="close-transfer-modal">Отмена</button>
          <button type="button" class="btn btn-primary" data-action="confirm-transfer">Подтвердить перевод</button>
        </div>
      </div>
    </div>
  `;
}

// Заявления со статусом "На рассмотрении"/"Принято решение" кликабельны в
// очереди и в ленте событий, но карточка для них не открывается — вместо
// этого показывается это окно. Дальнейшая работа с таким заявлением (ход
// рассмотрения, протокол) — часть основного интерфейса ЕАВИИАС МСЭ и
// сознательно оставлена вне периметра прототипа маршрутизации.
function renderInfoModal() {
  const open = state.infoModalOpen === true;
  return `
    <div class="modal-overlay ${open ? 'open' : ''}" role="dialog" aria-modal="true" aria-labelledby="info-modal-title" aria-hidden="${!open}">
      <div class="modal-box">
        <h3 id="info-modal-title">Заявление недоступно для просмотра</h3>
        <p>Просмотр заявления доступен в полной версии системы. В прототипе доступен просмотр только заявлений со статусом «Ожидает рассмотрения».</p>
        <div class="modal-actions">
          <button type="button" class="btn btn-primary" data-action="close-info-modal">Понятно</button>
        </div>
      </div>
    </div>
  `;
}

/* =====================================================================
   9. РЕНДЕР: МОНИТОРИНГ (роль: руководитель бюро) + SVG-визуализации
   ===================================================================== */

// Числа за неделю/месяц — реальный срез очереди (все заявления укладываются
// в отчётный месяц). Квартал — самостоятельная агрегация, см. buildQuarterFlowStats:
// заявления прошлых месяцев уже закрыты и не хранятся в этой же очереди.
function getFlowStats(period) {
  if (period === 'quarter') return state.quarterFlowStats;
  if (period === 'year') return state.yearFlowStats;
  const limit = period === 'week' ? 7 : 30;
  return computeFlowStatsFromList(state.applications.filter((a) => a.receivedDaysAgo <= limit));
}

function renderDistributionBar(counts, total) {
  const segs = [
    { key: 'simplified', label: 'Упрощённый трек', color: 'var(--track-simplified)', value: counts.simplified },
    { key: 'fullOffsite', label: 'Полный трек, заочно', color: '#8B96A3', value: counts.fullOffsite },
    { key: 'fullOnsite', label: 'Полный трек, очно', color: 'var(--track-full)', value: counts.fullOnsite },
  ];
  return `
    <div class="dist-bar-wrap">
      <div class="dist-bar">
        ${segs.map((s) => `<div class="dist-seg" style="width:${total ? (s.value / total * 100) : 0}%;background:${s.color}" title="${s.label}: ${s.value} заявлений (${total ? (s.value / total * 100).toFixed(1) : 0}%)"></div>`).join('')}
      </div>
      <div class="dist-legend">
        ${segs.map((s) => `<span class="item"><span class="swatch" style="background:${s.color}"></span>${s.label} — ${total ? (s.value / total * 100).toFixed(1) : 0}%</span>`).join('')}
      </div>
    </div>
  `;
}

function renderDurationBlock() {
  const stats = state.durationStats[state.monitoringPeriod];
  const rows = [
    { key: 'simplified', label: 'Упрощённый трек', color: 'var(--track-simplified)', benchmark: CONFIG.DURATION_BENCHMARKS.simplified },
    { key: 'fullOffsite', label: 'Полный трек, заочно', color: '#8B96A3', benchmark: CONFIG.DURATION_BENCHMARKS.fullOffsite },
    { key: 'fullOnsite', label: 'Полный трек, очно', color: 'var(--track-full)', benchmark: CONFIG.DURATION_BENCHMARKS.fullOnsite },
  ];
  const maxScale = Math.max(...rows.map((r) => Math.max(stats[r.key].avg, r.benchmark))) * 1.15;
  return rows.map((r) => {
    const s = stats[r.key];
    return `
      <div class="duration-row">
        <div class="duration-label">${r.label}</div>
        <div class="duration-bar-track">
          <div class="duration-bar-fill" style="width:${(s.avg / maxScale * 100).toFixed(1)}%;background:${r.color}"></div>
          <div class="duration-benchmark" style="left:${(r.benchmark / maxScale * 100).toFixed(1)}%" title="Ориентир: ${r.benchmark} дн."></div>
        </div>
        <div class="duration-value">${s.avg} раб. дн.<span class="benchmark-note">ориентир ${r.benchmark} дн.</span></div>
      </div>
    `;
  }).join('');
}

function renderQualityBlock() {
  const simplifiedBase = state.applications.filter((a) => a.track === 'simplified').length;
  const transferredCount = state.applications.filter((a) => a.transferred).length;
  const transferRate = simplifiedBase ? transferredCount / simplifiedBase : 0;
  const overLimit = transferRate > CONFIG.TRANSFER_RATE_LIMIT;

  const reviewRate = CONFIG.REVIEW_RATE_STATIC;
  const reviewOver = reviewRate > CONFIG.REVIEW_RATE_LIMIT;

  const renderIndicator = (title, value, limit, over, note) => `
    <div class="quality-card ${over ? 'warning' : ''}">
      <div class="q-title">${title}</div>
      <div class="q-value">${(value * 100).toFixed(1)}%</div>
      <div class="q-progress-track">
        <div class="q-progress-fill" style="width:${Math.min(100, value / (limit * 1.6) * 100).toFixed(1)}%"></div>
        <div class="q-limit-marker" style="left:${Math.min(100, limit / (limit * 1.6) * 100).toFixed(1)}%" title="Граница нормы: ${(limit * 100).toFixed(0)}%"></div>
      </div>
      <div class="q-note ${over ? 'warning-note' : ''}">${over ? `Превышена граница нормы (не более ${(limit * 100).toFixed(0)}%). ${note}` : `Граница нормы: не более ${(limit * 100).toFixed(0)}%`}</div>
    </div>
  `;

  return `
    <div class="quality-grid">
      ${renderIndicator('Доля дел, переведённых экспертом с упрощённого трека на полный', transferRate, CONFIG.TRANSFER_RATE_LIMIT, overLimit, 'Рекомендуется проверить причины переводов.')}
      ${renderIndicator('Доля дел упрощённого трека с пересмотренным решением', reviewRate, CONFIG.REVIEW_RATE_LIMIT, reviewOver, '')}
    </div>
  `;
}

function renderEventsBlock() {
  return `
    <div class="events-explain">Журнал фиксирует все назначения треков и действия экспертов.</div>
    <div class="table-wrap">
      <table class="events-table">
        <caption class="visually-hidden">Лента событий маршрутизации заявок</caption>
        <thead>
          <tr><th>Дата</th><th>Время</th><th>№ заявления</th><th>Тип события</th><th>Описание</th><th>Эксперт</th></tr>
        </thead>
        <tbody>
          ${state.events.map((e, i) => `
            <tr class="${i === 0 && e.isNew ? 'new-event' : ''}">
              <td>${formatDate(e.time)}</td>
              <td>${formatDateTime(e.time)}</td>
              <td><button type="button" class="link-button" data-action="open-card" data-id="${e.appId}">${esc(e.appNumber)}</button></td>
              <td>${esc(e.category)}</td>
              <td>${esc(e.description)}</td>
              <td class="event-expert">${e.expert ? esc(e.expert) : '—'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderMonitoringScreen() {
  const flow = getFlowStats(state.monitoringPeriod);
  const {
    total, simplified: simplifiedN, full: fullN, fullOffsite: fullOffsiteN, fullOnsite: fullOnsiteN,
    reduced: reducedN, reducedSimplified: reducedSimplifiedN, reducedFull: reducedFullN,
  } = flow;
  const transferredInPeriod = state.applications.filter((a) => a.transferred).length;
  const simplifiedBase = state.applications.filter((a) => a.track === 'simplified').length;

  const periodLabel = { week: 'неделю', month: 'месяц', quarter: 'квартал', year: 'год' }[state.monitoringPeriod];

  return `
    <h1 class="screen-title">Мониторинг</h1>
    <div class="monitor-controls">
      <div class="period-switch" role="group" aria-label="Период">
        <button type="button" data-action="set-period" data-period="week" class="${state.monitoringPeriod === 'week' ? 'active' : ''}">Неделя</button>
        <button type="button" data-action="set-period" data-period="month" class="${state.monitoringPeriod === 'month' ? 'active' : ''}">Месяц</button>
        <button type="button" data-action="set-period" data-period="quarter" class="${state.monitoringPeriod === 'quarter' ? 'active' : ''}">Квартал</button>
        <button type="button" data-action="set-period" data-period="year" class="${state.monitoringPeriod === 'year' ? 'active' : ''}">Год</button>
      </div>
      <div class="threshold-line">Порог маршрутизации: 0,82 · установлен ${CONFIG.THRESHOLD_SET_DATE}</div>
    </div>

    <div class="panel">
      <h2 class="block-title">Поток и распределение</h2>
      <div class="tiles-row">
        <div class="tile">
          <div class="tile-label">Поступило заявлений за ${periodLabel}</div>
          <div class="tile-value" data-countup="${total}" data-current-value="0">0</div>
        </div>
        <div class="tile">
          <div class="tile-label">Направлено на упрощённый трек</div>
          <div class="tile-value" data-countup="${simplifiedN}" data-current-value="0">0</div>
        </div>
        <div class="tile">
          <div class="tile-label">Направлено на полный трек</div>
          <div class="tile-value" data-countup="${fullN}" data-current-value="0">0</div>
        </div>
        <div class="tile" title="Упрощённый трек: ${reducedSimplifiedN} · Полный трек: ${reducedFullN}">
          <div class="tile-label">Заявлений с сокращённым сроком</div>
          <div class="tile-value" data-countup="${reducedN}" data-current-value="0">0</div>
        </div>
      </div>
      ${renderDistributionBar({ simplified: simplifiedN, fullOffsite: fullOffsiteN, fullOnsite: fullOnsiteN }, total)}
      <div class="tiles-row" style="grid-template-columns:1fr;margin-top:16px;">
        <div class="tile">
          <div class="tile-label">Переведено с упрощённого на полный (за месяц, накопительно)</div>
          <div class="tile-value" data-countup="${transferredInPeriod}" data-current-value="0">0</div>
          <div class="tile-sub">${simplifiedBase ? (transferredInPeriod / simplifiedBase * 100).toFixed(1) : 0}% от заявок упрощённого трека</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2 class="block-title">Средний срок рассмотрения заявления</h2>
      ${renderDurationBlock()}
    </div>

    <div class="panel">
      <h2 class="block-title">Контроль качества</h2>
      ${renderQualityBlock()}
    </div>

    <div class="panel">
      <h2 class="block-title">Лента событий</h2>
      ${renderEventsBlock()}
    </div>
  `;
}

/* =====================================================================
   10. ОБРАБОТЧИКИ СОБЫТИЙ
   ===================================================================== */

function attachHandlers() {
  const root = document.getElementById('app-root');

  root.querySelectorAll('[data-action="set-role"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const role = btn.dataset.role;
      if (role === state.role) return;
      state.role = role;
      state.screen = 'queue';
      state.headTab = 'monitoring';
      state.selectedAppId = null;
      render();
      showToast('info', role === 'head' ? 'Режим: Руководитель бюро' : 'Режим: Эксперт бюро');
    });
  });

  root.querySelectorAll('[data-action="set-head-tab"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.headTab = btn.dataset.tab;
      state.screen = 'queue';
      state.selectedAppId = null;
      render();
    });
  });

  // data-action="open-card" встречается и в очереди, и в ленте событий мониторинга —
  // клик открывает карточку поверх текущего экрана. Заявления, по которым уже
  // идёт рассмотрение или принято решение, не открываются — показывается
  // информационное окно (см. renderInfoModal): дальнейший ход рассмотрения
  // вне периметра этого модуля. headTab сбрасывается в 'queue', иначе у
  // руководителя карточка "откроется" под всё ещё видимым мониторингом.
  const openApplicationById = (id) => {
    const app = state.applications.find((a) => a.id === id);
    if (!app) return;
    if (app.status !== REVIEW_STATUS.PENDING) {
      state.infoModalOpen = true;
      render();
      return;
    }
    state.selectedAppId = id;
    state.screen = 'card';
    state.headTab = 'queue';
    state.stubPanelOpen = false;
    render();
  };

  root.querySelectorAll('[data-action="open-card"]').forEach((row) => {
    const open = () => openApplicationById(Number(row.dataset.id));
    row.addEventListener('click', open);
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  });

  // Клик в любом месте строки очереди (не только по номеру заявления) тоже открывает карточку.
  root.querySelectorAll('[data-action="open-card-row"]').forEach((row) => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('[data-action="open-card"]')) return; // избегаем двойного рендера
      openApplicationById(Number(row.dataset.id));
    });
  });

  root.querySelectorAll('[data-action="close-info-modal"]').forEach((btn) => {
    btn.addEventListener('click', () => { state.infoModalOpen = false; render(); });
  });

  const back = root.querySelector('[data-action="back-to-queue"]');
  if (back) back.addEventListener('click', () => { state.screen = 'queue'; render(); });

  const trackSel = root.querySelector('[data-action="filter-track"]');
  if (trackSel) trackSel.addEventListener('change', () => { state.filters.track = trackSel.value; state.page = 1; render(); });

  const deadlineSel = root.querySelector('[data-action="filter-deadline"]');
  if (deadlineSel) deadlineSel.addEventListener('change', () => { state.filters.deadline = deadlineSel.value; state.page = 1; render(); });

  const typeSel = root.querySelector('[data-action="filter-type"]');
  if (typeSel) typeSel.addEventListener('change', () => { state.filters.type = typeSel.value; state.page = 1; render(); });

  // Мультивыбор статуса: пустой выбор = показывать все статусы. Раскрытое
  // состояние <details> хранится отдельно, чтобы попап не закрывался при
  // отметке очередного чекбокса (каждый клик по чекбоксу вызывает render()).
  const statusFilter = root.querySelector('[data-action="status-filter"]');
  if (statusFilter) {
    statusFilter.addEventListener('toggle', () => { state.filters.statusPanelOpen = statusFilter.open; });
  }
  root.querySelectorAll('[data-action="filter-status-checkbox"]').forEach((checkbox) => {
    checkbox.addEventListener('change', () => {
      const value = checkbox.value;
      const idx = state.filters.status.indexOf(value);
      if (checkbox.checked && idx === -1) state.filters.status.push(value);
      if (!checkbox.checked && idx !== -1) state.filters.status.splice(idx, 1);
      state.filters.statusPanelOpen = true;
      state.page = 1;
      render();
    });
  });

  const searchInput = root.querySelector('[data-action="filter-search"]');
  if (searchInput) {
    // render() полностью пересоздаёт DOM — старый узел input после этого отсоединён,
    // поэтому фокус и позицию курсора нужно восстанавливать на НОВОМ узле, иначе
    // ввод каждого символа выглядит как "зависание" поля (фокус улетает в никуда).
    searchInput.addEventListener('input', () => {
      const caret = searchInput.selectionStart;
      state.filters.search = searchInput.value;
      state.page = 1;
      render();
      const freshInput = document.getElementById('filter-search');
      if (freshInput) {
        freshInput.focus();
        freshInput.setSelectionRange(caret, caret);
      }
    });
  }

  root.querySelectorAll('[data-action="sort"]').forEach((th) => {
    const doSort = () => {
      const field = th.dataset.field;
      if (state.sort.field === field) state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
      else { state.sort.field = field; state.sort.dir = 'desc'; }
      render();
    };
    th.addEventListener('click', doSort);
    th.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doSort(); } });
  });

  root.querySelectorAll('[data-action="page"]').forEach((btn) => {
    btn.addEventListener('click', () => { state.page = Number(btn.dataset.page); render(); });
  });

  // Тоста здесь намеренно нет: панель справа уже содержит тот же текст
  // ("Просмотр документа доступен..."), дублировать его тостом избыточно.
  root.querySelectorAll('[data-action="open-doc-stub"]').forEach((row) => {
    const open = () => { state.stubPanelOpen = Number(row.dataset.idx); render(); };
    row.addEventListener('click', open);
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  });

  // Клик в любом месте строки документа (не только по названию) тоже открывает панель.
  root.querySelectorAll('[data-action="open-doc-stub-row"]').forEach((row) => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('[data-action="open-doc-stub"]')) return;
      state.stubPanelOpen = Number(row.dataset.idx);
      render();
    });
  });
  root.querySelectorAll('[data-action="close-stub"]').forEach((el) => {
    el.addEventListener('click', () => { state.stubPanelOpen = false; render(); });
  });

  const openTransferBtn = root.querySelector('[data-action="open-transfer-modal"]');
  if (openTransferBtn) openTransferBtn.addEventListener('click', () => { state.transferModalAppId = Number(openTransferBtn.dataset.id); render(); });
  root.querySelectorAll('[data-action="close-transfer-modal"]').forEach((btn) => {
    btn.addEventListener('click', () => { state.transferModalAppId = null; render(); });
  });

  const confirmBtn = root.querySelector('[data-action="confirm-transfer"]');
  const reasonSelect = root.querySelector('#transfer-reason');
  const otherWrap = root.querySelector('#transfer-reason-other-wrap');
  const otherInput = root.querySelector('#transfer-reason-other');
  if (reasonSelect && otherWrap && otherInput) {
    const syncOtherField = () => {
      const isOther = reasonSelect.value === 'иное';
      otherWrap.hidden = !isOther;
      if (confirmBtn) confirmBtn.disabled = isOther && !otherInput.value.trim();
    };
    syncOtherField();
    reasonSelect.addEventListener('change', syncOtherField);
    otherInput.addEventListener('input', syncOtherField);
  }

  if (confirmBtn) confirmBtn.addEventListener('click', () => {
    let reason = reasonSelect ? reasonSelect.value : 'иное';
    if (reason === 'иное') {
      const otherText = otherInput ? otherInput.value.trim() : '';
      if (!otherText) return; // кнопка задизейблена в этом состоянии, но проверяем на всякий случай
      reason = `иное — ${otherText}`;
    }
    const app = state.applications.find((a) => a.id === state.transferModalAppId);
    if (app) {
      app.transferred = true;
      app.transferReason = reason;
      app.transferDate = new Date();
      const reasonDisplay = reason.charAt(0).toUpperCase() + reason.slice(1);
      state.events.unshift({
        time: new Date(),
        appId: app.id,
        appNumber: app.number,
        category: 'Перевод трека',
        description: `Упрощённый → Полный · ${reasonDisplay}`,
        expert: 'Смирнова Е.А.',
        isNew: true,
      });
      state.events = state.events.slice(0, CONFIG.EVENTS_VISIBLE);
      state.transferModalAppId = null;
      render();
      showToast('success', `Заявление № ${app.number} переведено на полный трек`);

      const simplifiedBase = state.applications.filter((a) => a.track === 'simplified').length;
      const transferredCount = state.applications.filter((a) => a.transferred).length;
      const rate = simplifiedBase ? transferredCount / simplifiedBase : 0;
      if (rate > CONFIG.TRANSFER_RATE_LIMIT) {
        showToast('warning', `Доля переводов превысила границу нормы — ${(rate * 100).toFixed(1)}%`);
      }
    }
  });

  root.querySelectorAll('[data-action="set-period"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.monitoringPeriod = btn.dataset.period;
      render();
      const label = { week: 'неделя', month: 'месяц', quarter: 'квартал', year: 'год' }[state.monitoringPeriod];
      showToast('info', `Показатели пересчитаны за период: ${label}`);
    });
  });
}

/* =====================================================================
   11. ИНИЦИАЛИЗАЦИЯ
   ===================================================================== */

render();

</script>
